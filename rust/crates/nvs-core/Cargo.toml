[package]
name = "nvs-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Vector Store (Rust) core reader library"

[lib]
name = "nvs_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
cpufeatures = "0.2"
ordered-float = "4"
half = "2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
rand = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[[bench]]
name = "vector_search"
harness = false
