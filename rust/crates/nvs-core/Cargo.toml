[package]
name = "nvs-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Vector Store (Rust) core reader library"

[lib]
name = "nvs_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
