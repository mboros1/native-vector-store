[package]
name = "nvs-packer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI: Convert JSON docs to native-vector-store bundle (Rust)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
walkdir = "2"
rayon = "1"
nvs-core = { path = "../nvs-core" }
indicatif = "0.17"
console = "0.15"
half = "2"
zstd = "0.13"
rustc-hash = "1.1"
dashmap = "5"
fxhash = "0.2"
crossbeam-channel = "0.5"
memmap2 = "0.9"
