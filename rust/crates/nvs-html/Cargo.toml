[package]
name = "nvs-html"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Vector Store — HTML orchestrator and chunking (Rust)"

[lib]
name = "nvs_html"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tokenmonster = { path = "../tokenmonster" }
nvs-core = { path = "../nvs-core" }
nvs-html-core = { path = "../nvs-html-core" }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "html_pipeline"
harness = false

[[bin]]
name = "chunk-html-cli"
path = "src/bin/chunk-html-cli.rs"
