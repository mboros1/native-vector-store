[package]
name = "nvs-embed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Embedder for chunked JSON docs using OpenAI embeddings"

[lib]
name = "nvs_embed"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "deflate", "stream"] }
futures = "0.3"
thiserror = "1"
console = "0.15"
indicatif = "0.17"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "embed-cli"
path = "src/bin/embed-cli.rs"
