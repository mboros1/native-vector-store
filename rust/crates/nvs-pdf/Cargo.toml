[package]
name = "nvs-pdf"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast PDF text chunker (Rust) matching fast-pdf-parser JSON schema"

[lib]
name = "nvs_pdf"
path = "src/lib.rs"

[features]
default = []
pdfium-bundled = []
pdfium-system = []

[dependencies]
pdfium-render = { version = "0.8.35", features = ["pdfium_latest"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tokenmonster = { path = "../tokenmonster" }
rayon = "1"
once_cell = "1"
num_cpus = "1"
indicatif = "0.17"
nvs-pdf-core = { path = "../nvs-pdf-core" }
crossbeam-channel = "0.5"
memmap2 = "0.9"

[dev-dependencies]
