[package]
name = "nvs-cli"
version = "0.1.0"
edition = "2021"
description = "Interactive CLI for Native Vector Store bundles"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
nvs-core = { path = "../nvs-core" }
nvs-embed = { path = "../nvs-embed" }
nvs-packer = { path = "../nvs-packer" }
num_cpus = "1"

[features]
default = []
# Build a single CLI binary with the local GTE-small model embedded.
embed-model = ["nvs-embed/embed-model"]
# Allow auto-fetch of model files from HF Hub when not present locally.
hub-fetch = ["nvs-embed/hub-fetch"]
