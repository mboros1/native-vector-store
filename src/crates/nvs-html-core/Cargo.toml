[package]
name = "nvs-html-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Vector Store — HTML core extractor (Rust)"

[lib]
name = "nvs_html_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
html5ever = "0.26"
markup5ever = "0.11"
markup5ever_rcdom = "0.2"
encoding_rs = "0.8"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "html_extract"
harness = false
