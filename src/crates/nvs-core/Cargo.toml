[package]
name = "nvs-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Vector Store (Rust) core: bundle format, mmap reader, vector/BM25/hybrid search"
repository = "https://github.com/martinboros/native-vector-store"
readme = "README.md"
keywords = ["vector", "search", "bm25", "retrieval", "embedding"]
categories = ["algorithms", "data-structures", "database-implementations"]
homepage = "https://github.com/martinboros/native-vector-store"
documentation = "https://docs.rs/nvs-core"

# Keep the published crate lean
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE*",
    "src/**",
    "benches/**",
    "examples/**",
]

[lib]
name = "nvs_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
cpufeatures = "0.2"
ordered-float = "4"
half = "2"
zstd = "0.13"
tokenmonster = { version = "0.1.0", path = "../tokenmonster" }
once_cell = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
rand = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[[bench]]
name = "vector_search"
harness = false

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
