[package]
name = "nvs-packer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI: Convert JSON docs to native-vector-store bundle (Rust)"
repository = "https://github.com/martinboros/native-vector-store"
readme = "README.md"
keywords = ["vector", "bm25", "cli", "indexing", "retrieval"]
categories = ["command-line-utilities", "compression", "data-structures"]

# Keep the published crate lean
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE*",
    "src/**",
    "benches/**",
    "tests/**",
]

[lib]
name = "nvs_packer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
walkdir = "2"
rayon = "1"
nvs-core = { version = "0.1.0", path = "../nvs-core" }
indicatif = "0.17"
console = "0.15"
half = "2"
zstd = "0.13"
rustc-hash = "1.1"
dashmap = "5"
fxhash = "0.2"
crossbeam-channel = "0.5"
memmap2 = "0.9"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bm25_pack"
harness = false
