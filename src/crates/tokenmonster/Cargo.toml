[package]
name = "tokenmonster"
version = "0.1.0"
edition = "2021"
description = "Greedy tiktoken-like tokenizer with embedded vocabulary (cl100k-base approximator)"
license = "MIT"
repository = "https://github.com/martinboros/native-vector-store"
readme = "README.md"
keywords = ["tokenizer", "nlp", "tiktoken"]
categories = ["text-processing", "algorithms"]

# Keep the published crate lean
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE*",
    "src/**",
    "data/**",
    "benches/**",
]

[features]
# Use a tiny inline vocabulary for tests and examples.
tiny_vocab = []

[dependencies]
once_cell = "1"
ahash = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
serde_json = "1"
