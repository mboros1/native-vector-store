name: Build and Publish to npm (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        default: 'true'

jobs:
  build-prebuilds:
    uses: ./.github/workflows/prebuilds.yml

  publish:
    needs: build-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for pushing to gh-pages branch
      pages: write     # Required for GitHub Pages
      id-token: write  # Required for GitHub Pages
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds/
      
      - name: List all prebuilds
        run: |
          echo "Downloaded prebuilds:"
          find prebuilds -name "*.node" -type f | sort
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Generate documentation
        run: |
          echo "Generating JSDoc documentation..."
          npm run docs
          echo "Documentation generated. Contents:"
          find docs -type f -name "*.html" | head -20
          echo "Total documentation files: $(find docs -type f | wc -l)"
          echo "Documentation size: $(du -sh docs | cut -f1)"
      
      - name: Create package
        run: |
          # Ensure prebuilds are in the right location
          echo "Package contents:"
          npm pack --dry-run
          echo ""
          echo "Documentation files that will be included:"
          npm pack --dry-run | grep -E "docs/.*\.(html|css|js)" | head -10
          echo "... and more"
      
      - name: Publish to npm (if not dry run)
        if: github.event_name == 'release' || github.event.inputs.dry_run != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Upload package artifact
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
      
      - name: Deploy docs to GitHub Pages (latest)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation for ${{ github.ref_name }}'
      
      - name: Deploy versioned docs (releases only)
        if: github.event_name == 'release'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ github.event.release.tag_name }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation for ${{ github.event.release.tag_name }}'
          keep_files: true  # Don't delete other versions
