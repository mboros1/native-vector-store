name: Ensure Onboarding Issue

on:
  workflow_dispatch:
  push:
    branches: [ trunk, main, master ]

jobs:
  ensure-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure onboarding issue exists and is pinned
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Onboarding: env & hardware check';
            const body = `Welcome! Please run the dev checker and then build/tests. This helps us catch Rosetta/WSL/VM perf quirks and toolchain mismatches early.\n\n## Step 1 — devcheck (human output)\n\n\`\`\`bash\n cargo run -p devcheck --release\n\`\`\`\n\nOptional JSON:\n\n\`\`\`bash\n cargo run -p devcheck --release -- --json --len 8000000\n\`\`\`\n\n## Step 2 — build & tests (workspace)\n\n\`\`\`bash\n cargo build --workspace\n cargo test --workspace\n\`\`\`\n\n## Checklist\n- [ ] OS/Arch printed (e.g., linux/x86_64 or macos/aarch64)\n- [ ] Features include expected SIMD (AVX2 on x86_64, NEON on ARM)\n- [ ] SIMD sum test shows speedup ≥ 1.5× (if not, tell us — might be Rosetta/VM/WSL)\n- [ ] cargo build --workspace succeeded\n- [ ] cargo test --workspace succeeded\n\n## Paste outputs here\n\n\`\`\`\n<paste devcheck human output>\n\`\`\`\n\nOptional JSON\n\n\`\`\`\n<paste devcheck JSON output>\n\`\`\``;
            // Try to find existing open issue with exact title
            const issues = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });
            let issueNumber;
            if (issues.data.items.length === 0) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation']
              });
              issueNumber = created.data.number;
              core.info(`Created issue #${issueNumber}`);
            } else {
              issueNumber = issues.data.items[0].number;
              core.info(`Found existing issue #${issueNumber}`);
            }
            // Pin via GraphQL (REST does not have pin)
            const pinMutation = `mutation($repoId:ID!, $issueId:ID!){ pinIssue(input:{repositoryId:$repoId, issueId:$issueId}){ clientMutationId } }`;
            // Fetch node IDs
            const repoData = await github.graphql(`query($owner:String!, $name:String!){ repository(owner:$owner, name:$name){ id } }`, {
              owner: context.repo.owner, name: context.repo.repo
            });
            const issueData = await github.graphql(`query($owner:String!, $name:String!, $number:Int!){ repository(owner:$owner, name:$name){ issue(number:$number){ id pinned } } }`, {
              owner: context.repo.owner, name: context.repo.repo, number: issueNumber
            });
            const repoId = repoData.repository.id;
            const issueId = issueData.repository.issue.id;
            const pinned = issueData.repository.issue.pinned;
            if (!pinned) {
              await github.graphql(pinMutation, { repoId, issueId });
              core.info(`Pinned issue #${issueNumber}`);
            } else {
              core.info(`Issue #${issueNumber} already pinned`);
            }
